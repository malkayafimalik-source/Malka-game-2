<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Survival 3D</title>

<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}

#hud{
 position:fixed;top:10px;left:10px;right:10px;
 z-index:10;display:flex;justify-content:space-between;
 color:white;pointer-events:none
}
.box{
 background:#000b;border:1px solid #ffffff30;
 border-radius:12px;padding:9px 12px
}
#hpbar{
 width:175px;height:12px;background:#333;
 border-radius:10px;overflow:hidden;margin-top:5px
}
#hpfill{
 width:100%;height:100%;background:#18d34b
}
#weaponBox{text-align:right}
#weapon{font-weight:bold}
#ammo{font-size:21px;font-weight:bold}

#cross{
 position:fixed;z-index:8;left:50%;top:50%;
 width:28px;height:28px;
 transform:translate(-50%,-50%);
 pointer-events:none
}
#cross:before,#cross:after{
 content:"";position:absolute;background:white
}
#cross:before{width:2px;height:28px;left:13px}
#cross:after{height:2px;width:28px;top:13px}

#joy{
 position:fixed;z-index:20;
 left:20px;bottom:25px;
 width:130px;height:130px;
 border:2px solid #ffffff30;
 border-radius:50%;
 background:#0005
}
#stick{
 position:absolute;
 left:34px;top:34px;
 width:58px;height:58px;
 border-radius:50%;
 background:#ffffff45;
 border:2px solid #ffffff66
}

#buttons{
 position:fixed;z-index:20;
 right:15px;bottom:20px;
 display:grid;
 grid-template-columns:80px 80px;
 gap:8px
}
button{
 height:55px;
 color:white;
 background:#000b;
 border:1px solid #ffffff40;
 border-radius:15px;
 font-weight:bold
}
button:active{transform:scale(.94)}
#shoot{
 grid-column:1/3;
 width:168px;height:70px;
 border-radius:40px;
 background:#a71919dd;
 font-size:18px
}

#reload{
 position:fixed;z-index:30;
 display:none;
 left:50%;bottom:105px;
 transform:translateX(-50%);
 width:180px;height:8px;
 background:#333;border-radius:10px
}
#reloadbar{
 height:100%;width:0;background:white
}

#message{
 position:fixed;z-index:30;
 top:45%;left:50%;
 transform:translate(-50%,-50%);
 color:white;font-size:26px;
 font-weight:bold;text-shadow:0 2px 5px #000;
 pointer-events:none
}

#gameover{
 position:fixed;z-index:50;
 inset:0;display:none;
 background:#000c;
 color:white;text-align:center;
 align-items:center;
 justify-content:center;
 flex-direction:column
}
#gameover button{
 width:190px;height:60px;
 background:#b71919;font-size:18px
}
</style>
</head>

<body>

<div id="hud">

 <div class="box">
  ❤️ HP: <b id="hp">100</b>

  <div id="hpbar">
   <div id="hpfill"></div>
  </div>

  Wave: <b id="wave">1</b>
  &nbsp; Zombie: <b id="zombies">0</b>
 </div>

 <div class="box" id="weaponBox">
  🔫 <span id="weapon">Pistol</span>
  <br>
  <span id="ammo">12 / 12</span>
 </div>

</div>

<div id="cross"></div>

<div id="message"></div>

<div id="reload">
 <div id="reloadbar"></div>
</div>

<div id="joy">
 <div id="stick"></div>
</div>

<div id="buttons">
 <button id="change">🔄 SENJATA</button>
 <button id="reloadBtn">↻ RELOAD</button>
 <button id="shoot">🔫 TEMBAK</button>
</div>

<div id="gameover">
 <h1>💀 GAME OVER</h1>
 <p id="result"></p>
 <button id="again">MAIN LAGI</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   VARIABEL
========================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let weaponModel;

let zombies=[];

let HP=100;
let wave=1;
let kills=0;

let yaw=0;
let pitch=0;

let moveX=0;
let moveY=0;

let lookId=null;
let lastLookX=0;
let lastLookY=0;

let joyId=null;

let lastShot=0;
let reloading=false;


/* =========================
   SENJATA
========================= */

const weapons=[

 {
  name:"Pistol",
  damage:45,
  magazine:12,
  ammo:12,
  fireRate:350,
  reload:900
 },

 {
  name:"Shotgun",
  damage:28,
  magazine:6,
  ammo:6,
  fireRate:750,
  reload:1300
 },

 {
  name:"Rifle",
  damage:18,
  magazine:30,
  ammo:30,
  fireRate:110,
  reload:1500
 }

];

let weaponIndex=0;
let currentWeapon=weapons[0];


/* =========================
   MULAI GAME
========================= */

function init(){

 scene=new THREE.Scene();

 scene.background=
  new THREE.Color(0x15191c);

 scene.fog=
  new THREE.Fog(
   0x15191c,
   15,
   90
  );


 camera=
  new THREE.PerspectiveCamera(
   70,
   innerWidth/innerHeight,
   .1,
   150
  );

 camera.position.y=1.7;


 renderer=
  new THREE.WebGLRenderer({
   antialias:true
  });

 renderer.setSize(
  innerWidth,
  innerHeight
 );

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.7)
 );

 renderer.shadowMap.enabled=true;

 document.body.appendChild(
  renderer.domElement
 );


 clock=new THREE.Clock();


 /* CAHAYA */

 scene.add(
  new THREE.HemisphereLight(
   0xffffff,
   0x333333,
   2
  )
 );

 const sun=
  new THREE.DirectionalLight(
   0xffffff,1.5
  );

 sun.position.set(
  -20,30,10
 );

 sun.castShadow=true;

 scene.add(sun);


 /* TANAH */

 const floor=
  new THREE.Mesh(
   new THREE.PlaneGeometry(140,140),
   new THREE.MeshStandardMaterial({
    color:0x353935
   })
  );

 floor.rotation.x=-Math.PI/2;
 floor.receiveShadow=true;

 scene.add(floor);


 /* GARIS TANAH */

 const grid=
  new THREE.GridHelper(
   140,70,
   0x555555,
   0x292929
  );

 scene.add(grid);


 /* BANGUNAN */

 for(let i=0;i<35;i++){

  const h=2+Math.random()*5;

  const building=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     2+Math.random()*3,
     h,
     2+Math.random()*3
    ),
    new THREE.MeshStandardMaterial({
     color:0x303030
    })
   );

  building.position.set(
   (Math.random()-.5)*100,
   h/2,
   (Math.random()-.5)*100
  );

  building.castShadow=true;

  scene.add(building);
 }


 /* PLAYER */

 player=
  new THREE.Object3D();

 player.position.set(
  0,0,8
 );

 scene.add(player);


 createWeapon();

 setupControls();

 resize();

 spawnWave();

 updateHUD();

 animate();
}


/* =========================
   SENJATA DI TANGAN
========================= */

function createWeapon(){

 weaponModel=
  new THREE.Group();


 const black=
  new THREE.MeshStandardMaterial({
   color:0x161616,
   metalness:.7,
   roughness:.3
  });


 const brown=
  new THREE.MeshStandardMaterial({
   color:0x4b2917
  });


 /* BADAN SENJATA */

 const body=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .24,.2,.7
   ),
   black
  );

 body.position.set(
  .35,-.25,-.7
 );

 weaponModel.add(body);


 /* LARAS */

 const barrel=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .045,.045,.55,12
   ),
   black
  );

 barrel.rotation.x=Math.PI/2;

 barrel.position.set(
  .35,-.25,-1.08
 );

 weaponModel.add(barrel);


 /* PEGANGAN */

 const handle=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .14,.4,.2
   ),
   brown
  );

 handle.rotation.x=-.25;

 handle.position.set(
  .35,-.47,-.55
 );

 weaponModel.add(handle);


 /* TANGAN */

 const hand=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .17,.18,.25
   ),
   new THREE.MeshStandardMaterial({
    color:0xb8795e
   })
  );

 hand.position.set(
  .25,-.42,-.48
 );

 weaponModel.add(hand);


 camera.add(weaponModel);
 scene.add(camera);
}


/* =========================
   ZOMBIE
========================= */

function createZombie(){

 const zombie=
  new THREE.Group();


 const skin=
  new THREE.MeshStandardMaterial({
   color:0x718365
  });


 const clothes=
  new THREE.MeshStandardMaterial({
   color:0x30383a
  });


 const pants=
  new THREE.MeshStandardMaterial({
   color:0x202428
  });


 /* BADAN */

 const body=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .65,1.05,.4
   ),
   clothes
  );

 body.position.y=1.2;

 zombie.add(body);


 /* KEPALA */

 const head=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .32,16,12
   ),
   skin
  );

 head.position.y=1.95;

 zombie.add(head);


 /* MATA */

 const eyeMaterial=
  new THREE.MeshBasicMaterial({
   color:0xff2222
  });

 for(const x of [-.11,.11]){

  const eye=
   new THREE.Mesh(
    new THREE.SphereGeometry(
     .05,8,8
    ),
    eyeMaterial
   );

  eye.position.set(
   x,2,-.29
  );

  zombie.add(eye);
 }


 /* TANGAN */

 const arm=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .18,.85,.18
   ),
   skin
  );

 arm.position.set(
  -.48,1.2,0
 );

 arm.rotation.z=-.3;

 zombie.add(arm);


 const arm2=arm.clone();

 arm2.position.x=.48;
 arm2.rotation.z=.3;

 zombie.add(arm2);


 /* KAKI */

 const leg=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .22,.9,.25
   ),
   pants
  );

 leg.position.set(
   -.18,.45,0
  );

 zombie.add(leg);


 const leg2=leg.clone();

 leg2.position.x=.18;

 zombie.add(leg2);


 /* DATA ZOMBIE */

 zombie.hp=
  100+wave*20;

 zombie.speed=
  1.2+wave*.08;

 zombie.attackTimer=0;


 /* POSISI RANDOM */

 const angle=
  Math.random()*Math.PI*2;

 const distance=
  25+Math.random()*20;

 zombie.position.set(
  player.position.x+
   Math.cos(angle)*distance,

  0,

  player.position.z+
   Math.sin(angle)*distance
 );


 scene.add(zombie);

 zombies.push(zombie);
}


/* =========================
   WAVE
========================= */

function spawnWave(){

 const amount=
  3+wave*2;

 for(let i=0;i<amount;i++){
  createZombie();
 }

 updateHUD();

 showMessage(
  "WAVE "+wave,
  1000
 );
}


/* =========================
   TEMBAK
========================= */

function shoot(){

 if(reloading)return;

 const now=
  performance.now();

 if(
  now-lastShot<
  currentWeapon.fireRate
 )return;


 if(currentWeapon.ammo<=0){

  showMessage(
   "PELURU HABIS",
   600
  );

  return;
 }


 lastShot=now;

 currentWeapon.ammo--;

 updateHUD();


 /* FLASH TEMBAKAN */

 const flash=
  new THREE.PointLight(
   0xffaa44,
   5,
   3
  );

 flash.position.set(
  .35,-.25,-1.1
 );

 weaponModel.add(flash);

 setTimeout(
  ()=>weaponModel.remove(flash),
  60
 );


 /* RAYCAST */

 const ray=
  new THREE.Raycaster();

 ray.setFromCamera(
  new THREE.Vector2(0,0),
  camera
 );


 let objects=[];

 zombies.forEach(
  zombie=>{
   zombie.traverse(
    object=>{
     if(object.isMesh)
      objects.push(object);
    }
   );
  }
 );


 const hits=
  ray.intersectObjects(
   objects
  );


 if(!hits.length)return;


 let target=
  hits[0].object;


 while(
  target &&
  !zombies.includes(target)
 ){
  target=target.parent;
 }


 if(!target)return;


 target.hp-=
  currentWeapon.damage;


 if(target.hp<=0){

  scene.remove(target);

  zombies=
   zombies.filter(
    z=>z!==target
   );

  kills++;

  updateHUD();


  if(zombies.length===0){

   wave++;

   setTimeout(
    ()=>{
     if(!gameOver())
      spawnWave();
    },
    800
   );
  }
 }
}


/* =========================
   RELOAD
========================= */

function reload(){

 if(
  reloading ||
  currentWeapon.ammo===
  currentWeapon.magazine
 )return;


 reloading=true;

 const reloadBox=
  document.getElementById(
   "reload"
  );

 const reloadBar=
  document.getElementById(
   "reloadbar"
  );

 reloadBox.style.display=
  "block";

 reloadBar.style.width=
  "0%";


 const start=
  performance.now();


 const timer=
  setInterval(
   ()=>{

    const progress=
     (performance.now()-start)/
     currentWeapon.reload;

    reloadBar.style.width=
     Math.min(
      100,
      progress*100
     )+"%";


    if(progress>=1){

     clearInterval(timer);

     currentWeapon.ammo=
      currentWeapon.magazine;

     reloading=false;

     reloadBox.style.display=
      "none";

     updateHUD();
    }

   },
   30
  );
}


/* =========================
   GANTI SENJATA
========================= */

function changeWeapon(){

 if(reloading)return;

 weaponIndex++;

 if(
  weaponIndex>=weapons.length
 )
  weaponIndex=0;

 currentWeapon=
  weapons[weaponIndex];

 currentWeapon.ammo=
  currentWeapon.magazine;

 updateHUD();

 showMessage(
  currentWeapon.name,
  700
 );
}


/* =========================
   GERAK PLAYER
========================= */

function updatePlayer(dt){

 const x=moveX;
 const y=moveY;

 const speed=5;


 const forward=
  new THREE.Vector3(
   -Math.sin(yaw),
   0,
   -Math.cos(yaw)
  );


 const right=
  new THREE.Vector3(
   Math.cos(yaw),
   0,
   -Math.sin(yaw)
  );


 player.position.addScaledVector(
  forward,
  y*speed*dt
 );


 player.position.addScaledVector(
  right,
  x*speed*dt
 );


 player.position.x=
  Math.max(
   -65,
   Math.min(
    65,
    player.position.x
   )
  );


 player.position.z=
  Math.max(
   -65,
   Math.min(
    65,
    player.position.z
   )
  );


 camera.position.copy(
  player.position
 );

 camera.position.y=1.7;

 camera.rotation.order=
  "YXZ";

 camera.rotation.y=
  yaw;

 camera.rotation.x=
  pitch;


 /* GERAK SENJATA */

 weaponModel.position.y=
  Math.sin(
   performance.now()*.01
  )*.01;
}


/* =========================
   UPDATE ZOMBIE
========================= */

function updateZombies(dt){

 for(
  let i=0;
  i<zombies.length;
  i++
 ){

  const zombie=
   zombies[i];


  const dx=
   player.position.x-
   zombie.position.x;


  const dz=
   player.position.z-
   zombie.position.z;


  const distance=
   Math.hypot(dx,dz);


  if(distance>1){

   zombie.position.x+=
    dx/distance*
    zombie.speed*
    dt;


   zombie.position.z+=
    dz/distance*
    zombie.speed*
    dt;


   zombie.rotation.y=
    Math.atan2(
     dx,dz
    );


   /* ANIMASI KAKI */

   const swing=
    Math.sin(
     performance.now()*.01
    )*.3;

   zombie.children[2]
    .rotation.z=
    -.3+Math.abs(swing);

   zombie.children[3]
    .rotation.z=
    .3-Math.abs(swing);

  }else{

   zombie.attackTimer-=dt;


   if(
    zombie.attackTimer<=0
   ){

    zombie.attackTimer=.7;

    HP-=
     6+wave*.5;

    updateHUD();


    if(HP<=0){

     HP=0;

     showGameOver();

     return;
    }
   }
  }
 }
}


/* =========================
   HUD
========================= */

function updateHUD(){

 document.getElementById(
  "hp"
 ).textContent=
  Math.ceil(HP);


 document.getElementById(
  "hpfill"
 ).style.width=
  Math.max(
   0,
   HP
  )+"%";


 document.getElementById(
  "wave"
 ).textContent=
  wave;


 document.getElementById(
  "zombies"
 ).textContent=
  zombies.length;


 document.getElementById(
  "weapon"
 ).textContent=
  currentWeapon.name;


 document.getElementById(
  "ammo"
 ).textContent=
  currentWeapon.ammo+
  " / "+
  currentWeapon.magazine;
}


/* =========================
   PESAN
========================= */

let messageTimer;

function showMessage(
 text,
 time
){

 const msg=
  document.getElementById(
   "message"
  );

 msg.textContent=text;

 clearTimeout(messageTimer);

 messageTimer=
  setTimeout(
   ()=>{
    msg.textContent="";
   },
   time
  );
}


/* =========================
   JOYSTICK
========================= */

const joystick=
 document.getElementById(
  "joy"
 );

const stick=
 document.getElementById(
  "stick"
 );


function joystickMove(e){

 const rect=
  joystick.getBoundingClientRect();


 const centerX=
  rect.left+
  rect.width/2;


 const centerY=
  rect.top+
  rect.height/2;


 let dx=
  e.clientX-centerX;


 let dy=
  e.clientY-centerY;


 const max=45;


 const distance=
  Math.hypot(dx,dy);


 if(distance>max){

  dx=
   dx/distance*
   max;

  dy=
   dy/distance*
   max;
 }


 stick.style.transform=
  "translate("+dx+"px,"+
  dy+"px)";


 moveX=
  dx/max;


 moveY=
  dy/max;
}


joystick.addEventListener(
 "pointerdown",
 e=>{

  joyId=e.pointerId;

  joystick.setPointerCapture(
   e.pointerId
  );

  joystickMove(e);
 }
);


joystick.addEventListener(
 "pointermove",
 e=>{

  if(
   e.pointerId===joyId
  )
   joystickMove(e);
 }
);


function joystickEnd(){

 joyId=null;

 moveX=0;
 moveY=0;

 stick.style.transform=
  "translate(0,0)";
}


joystick.addEventListener(
 "pointerup",
 joystickEnd
);


joystick.addEventListener(
 "pointercancel",
 joystickEnd
);


/* =========================
   KAMERA
========================= */

renderer=
 null;


function setupControls(){

 const canvas=
  renderer.domElement;


 canvas.addEventListener(
  "pointerdown",
  e=>{

   if(
    e.clientX<
    innerWidth*.4
   )return;


   lookId=
    e.pointerId;

   lastLookX=
    e.clientX;

   lastLookY=
    e.clientY;


   canvas.setPointerCapture(
    e.pointerId
   );
  }
 );


 canvas.addEventListener(
  "pointermove",
  e=>{

   if(
    e.pointerId!==lookId
   )return;


   const dx=
    e.clientX-lastLookX;


   const dy=
    e.clientY-lastLookY;


   lastLookX=e.clientX;
   lastLookY=e.clientY;


   yaw-=
    dx*.004;


   pitch-=
    dy*.003;


   pitch=
    Math.max(
     -1.2,
     Math.min(
      1.2,
      pitch
     )
    );
  }
 );


 canvas.addEventListener(
  "pointerup",
  ()=>lookId=null
 );


 canvas.addEventListener(
  "pointercancel",
  ()=>lookId=null
 );
}


/* =========================
   TOMBOL
========================= */

document.getElementById(
 "shoot"
).addEventListener(
 "pointerdown",
 e=>{
  e.preventDefault();
  shoot();
 }
);


document.getElementById(
 "reloadBtn"
).addEventListener(
 "pointerdown",
 e=>{
  e.preventDefault();
  reload();
 }
);


document.getElementById(
 "change"
).addEventListener(
 "pointerdown",
 e=>{
  e.preventDefault();
  changeWeapon();
 }
);


/* =========================
   GAME OVER
========================= */

let isGameOver=false;

function gameOver(){
 return isGameOver;
}


function showGameOver(){

 isGameOver=true;

 document.getElementById(
  "result"
 ).innerHTML=
  "Wave: "+wave+
  "<br>Zombie dikalahkan: "+
  kills;


 document.getElementById(
  "gameover"
 ).style.display=
  "flex";
}


document.getElementById(
 "again"
).addEventListener(
 "click",
 ()=>{

  isGameOver=false;

  HP=100;
  wave=1;
  kills=0;

  weaponIndex=0;
  currentWeapon=
   weapons[0];

  currentWeapon.ammo=
   currentWeapon.magazine;


  zombies.forEach(
   z=>scene.remove(z)
  );

  zombies=[];


  player.position.set(
   0,0,8
  );


  document.getElementById(
   "gameover"
  ).style.display=
   "none";


  spawnWave();

  updateHUD();
 }
);


/* =========================
   RESIZE
========================= */

function resize(){

 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
);


}


/* =========================
   LOOP
========================= */

function animate(){

 requestAnimationFrame(
  animate
 );

 const dt=
  Math.min(
   clock.getDelta(),
   .05
  );


 if(!isGameOver){

  updatePlayer(dt);

  updateZombies(dt);
 }

 renderer.render(
  scene,
  camera
 );
}


window.addEventListener(
 "resize",
 resize
);


/* =========================
   JALANKAN
========================= */

init();

</script>

</body>
</html>
